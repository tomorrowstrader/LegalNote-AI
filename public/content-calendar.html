var posts = [
  {
    num: 1, week: 1, phase: 1, day: "Monday",
    theme: "The attendance note that started everything",
    voice: "Client", framework: "SLAY",
    content: "The attendance note had the wrong date.\n\nThe date was the entire basis of my legal dispute.\n\nI sat across from my solicitor. We discussed everything. The tenancy start date, the rent review mechanism, the breach of contract. She understood it. I understood it. We were aligned.\n\nTwo days later the attendance note arrived.\n\nThe start date was written as the 5th of March. It was the 15th. The entire matter hinged on the anniversary of that date triggering a rent review clause.\n\nIf I hadn\u2019t caught it, my case would have been built on incorrect documentation produced by my own solicitor.\n\nIt took six months and a chaser email to get that single date corrected.\n\nThat was the moment I realised something needed to exist that didn\u2019t.\n\nNot another AI tool. Not a fancy recorder.\n\nA system where what\u2019s said in the room is what ends up in the file. Accurately. Every time.\n\nThat\u2019s why I built LegalNote.\n\nPS \u2014 Have you ever received an attendance note that didn\u2019t match what was actually discussed?"
  },
  {
    num: 2, week: 1, phase: 1, day: "Wednesday",
    theme: "Estate to Royal College of Music",
    voice: "Personal", framework: "SLAY",
    content: "I lost the sight in my left eye at seven.\n\nA year later I had a scholarship to the Royal College of Music.\n\nGrowing up on an estate in London, the path was supposed to be football. That\u2019s what everyone around me did. But losing my sight meant that ceiling was already there whether I wanted to admit it or not.\n\nSo at eight years old I made a decision that most adults struggle with. I chose the thing that would actually work long-term over the thing that felt comfortable.\n\nThe Royal College of Music was a different planet. I went from my estate to sitting in rehearsal rooms with kids who\u2019d been playing since birth. Different backgrounds. Different expectations. Different everything.\n\nI practised flute for over two hours every single day. Not because I was talented. Because I understood something early that\u2019s shaped everything since:\n\nEverything is just a skill. Given enough time, practice, and discipline, it can be learned by anyone.\n\nThat belief took me from an estate to a music scholarship. From music to corporate. From corporate to founding LegalNote.\n\nThe environments change. The principle doesn\u2019t.\n\nPS \u2014 What skill did you have to teach yourself that changed your direction?"
  },
  {
    num: 3, week: 1, phase: 1, day: "Thursday",
    theme: "Corporate compliance credibility",
    voice: "Professional", framework: "PAS",
    content: "I\u2019ve sat inside Magic Circle law firms.\n\nI\u2019ve seen how documentation actually works behind closed doors.\n\nMy career took me through Clifford Chance, Coutts, Lloyd\u2019s of London, Standard Chartered, National Grid. Technology delivery. Compliance infrastructure. Documentation controls. Trading systems.\n\nMy role put me directly in front of the people who used these systems every day. Lawyers. Solicitors. Bankers. Traders. VPs.\n\nI trained them on compliance. What data to keep. What to delete. How to handle sensitive information. How to use their systems properly.\n\nAnd I watched.\n\nI watched solicitors struggle with documentation workflows that hadn\u2019t been updated in a decade. I watched notes get written from memory hours after the meeting. I watched critical details get lost between conversation and written record.\n\nThe problem was never the people. The people were sharp, dedicated, working under immense pressure.\n\nThe problem was the tools. The processes. The gap between what was said and what was written down.\n\nI didn\u2019t know it at the time, but every single one of those roles was preparing me to build LegalNote.\n\nPS \u2014 What\u2019s the biggest gap you see between how meetings happen and how they\u2019re documented?"
  },
  {
    num: 4, week: 1, phase: 1, day: "Saturday",
    theme: "Becoming a father changed everything",
    voice: "Father", framework: "SLAY",
    content: "My daughter is one year old.\n\nShe\u2019s changed how I think about risk.\n\nBefore her, I could absorb a loss. Take a hit. Start again. The downside was always just my own.\n\nNow the stakes are different. Not higher necessarily. Just wider.\n\nEvery decision I make with LegalNote sits in the context of her future. Not in some grand \u201cbuilding a legacy\u201d way. In a practical way.\n\nCan this sustain our family? Am I managing risk properly? Am I building something defensible, not just exciting?\n\nThat word keeps coming back. Defensible.\n\nIt\u2019s the same word I use when I talk to solicitors about their documentation. Is your attendance note defensible? Could it survive scrutiny? Does it accurately reflect what happened?\n\nTurns out building a company and building a legal record have the same requirement.\n\nIf it\u2019s not defensible, it\u2019s not worth much.\n\nPS \u2014 How has becoming a parent changed how you approach your work?"
  },
  {
    num: 5, week: 2, phase: 1, day: "Monday",
    theme: "I never wanted to be a lawyer",
    voice: "Client/Personal", framework: "SLAY",
    content: "I never wanted to be a lawyer.\n\nI just wanted to be able to defend myself.\n\nGrowing up, I didn\u2019t have access to legal advice. What I had was attention to detail and the stubborn belief that if something didn\u2019t feel right, I should look into it.\n\nWhen my landlord falsely accused me of being in rent arrears, I didn\u2019t panic. I went through the ledger line by line. Found a duplicated reversal of a heating reimbursement that created a false \u00a3470 deficit. Put the evidence in an email. Never received a response.\n\nWhen they tried to increase my rent outside the contractual review period, I read the clause. October 1st wasn\u2019t the anniversary of the tenancy. March 15th was. I kept paying as agreed.\n\nWhen they pressured me for nearly a year, threatened possession proceedings while I had a one-year-old daughter at home, I held my ground.\n\nThey eventually backed down. Not because I had a legal team. Because I had documentation.\n\nThat experience taught me something I now build into everything:\n\nDocumentation protects truth. And the person who controls the detail controls the outcome.\n\nPS \u2014 When was the last time your own documentation saved you?"
  },
  {
    num: 6, week: 2, phase: 1, day: "Wednesday",
    theme: "The diamond earring at Clifford Chance",
    voice: "Personal", framework: "SLAY",
    content: "Someone reported my earring at Clifford Chance.\n\nNot to my face. To my manager.\n\nMy first day at one of the most prestigious law firms in the world. I came in, did my work, built rapport with the team. Felt good about it.\n\nThe next morning my manager pulled me aside. Asked how I found my first day. I said it went well.\n\nThen he told me. Someone had raised an issue with me wearing a diamond earring.\n\nNobody said it to me directly. Nobody explained which policy it broke. It was just decided, behind my back, that something about how I presented myself wasn\u2019t acceptable.\n\nThis is why corporate never felt like home.\n\nNot because the work was bad. The work was excellent. The teams were often brilliant. But there was always an undercurrent. A lack of sincerity that I could never fully ignore.\n\nPeople in the same role for fifteen years with no ambition of their own, but quietly making sure you didn\u2019t get too far either. Saying one thing in meetings, another in corridors.\n\nI spent years navigating that. Learning from it. Building relationships despite it.\n\nAnd eventually I understood: I could either spend my career fighting that culture, or I could build my own.\n\nI chose to build.\n\nPS \u2014 Have you ever felt like you didn\u2019t belong in a space where you were clearly delivering?"
  },
  {
    num: 7, week: 2, phase: 1, day: "Thursday",
    theme: "From music videos to compliance systems",
    voice: "Two Worlds", framework: "SLAY",
    content: "I went from music videos to compliance infrastructure.\n\nMost people don\u2019t know how to place that.\n\nIn my early twenties I was in a pop group called Code Red. Millions of views on YouTube. Music videos. Concerts. Stages. The full thing.\n\nThe music industry teaches you something that no business school ever will: how to perform under pressure while everything around you is noise.\n\nThen I walked into corporate. Clifford Chance. Coutts. Lloyd\u2019s. Standard Chartered. Suit and tie. Security clearance. Compliance documentation.\n\nDifferent world. Same skill underneath.\n\nAttention to detail. The ability to read a room. Knowing when to speak and when to observe. Building trust with people who have no reason to trust you yet.\n\nEvery transition in my life has followed the same pattern. Walk into a space where you don\u2019t look like you belong. Prove your value through substance. Earn respect on your own terms.\n\nEstate to Royal College of Music. Music industry to corporate finance. Employee to founder.\n\nLegalNote is the latest version of that pattern. And this time, I\u2019m building the room.\n\nPS \u2014 What\u2019s the most unexpected career transition you\u2019ve made?"
  },
  {
    num: 8, week: 2, phase: 1, day: "Saturday",
    theme: "Touch typing saved my legal case",
    voice: "Client/Personal", framework: "SLAY",
    content: "My solicitor asked if I was a solicitor.\n\nI\u2019m not. I just type faster than most people can talk.\n\nWhen I went to discuss my tenancy dispute, I asked if I could record the meeting. The solicitor said no. No specific reason given. Just that it wouldn\u2019t be allowed.\n\nSo I opened my laptop and typed.\n\nWhat she didn\u2019t know is that I learned touch typing at a specialist school for visual impairment when I was seven. I can type while looking directly at someone. Full eye contact. Full conversation. Every word captured.\n\nShe was visibly impressed. \u201cAre you a solicitor?\u201d she asked, halfway through the meeting.\n\nThe irony is that despite all of that effort, the attendance note I received two days later still had the wrong date. Still missed a critical detail about how many keys I was supposed to receive.\n\nIf she\u2019d let me record, none of that would have mattered.\n\nIf she\u2019d had a tool that captured the conversation accurately with consent, the attendance note would have matched what was said.\n\nShe didn\u2019t have that tool. It didn\u2019t exist yet.\n\nNow it does.\n\nPS \u2014 How do you capture what\u2019s discussed in client meetings?"
  },
  {
    num: 9, week: 3, phase: 2, day: "Monday",
    theme: "Your attendance notes wouldn't survive an audit",
    voice: "Professional", framework: "PAS",
    content: "Most attendance notes are written from memory.\n\nThat\u2019s not documentation. That\u2019s recollection.\n\nThere\u2019s a fundamental difference between a record created during or immediately after an event, and one reconstructed hours later from what someone remembers.\n\nIn regulated environments like banking, we call the first one contemporaneous documentation. It\u2019s treated as evidence.\n\nThe second one? In an audit, it\u2019s treated as opinion.\n\nHere\u2019s what I observed working inside highly regulated organisations:\n\n1. Timestamps matter. A note created 4 hours after a meeting carries less weight than one created during.\n2. Accuracy degrades with time. Studies show memory distortion begins within 20 minutes.\n3. Audit trails exist or they don\u2019t. \u201cI wrote it that day\u201d isn\u2019t provable without a system that logs it.\n\nMost boutique law firms are advising clients on defensibility and compliance.\n\nBut their own documentation workflow \u2014 the attendance note \u2014 would fail the standard they\u2019re advising on.\n\nThat\u2019s the gap LegalNote closes. Contemporaneous. Timestamped. Tamper-evident.\n\nNot because it\u2019s fancy. Because that\u2019s what evidence requires.\n\nPS \u2014 If your attendance notes were audited tomorrow, would they hold up?"
  },
  {
    num: 10, week: 3, phase: 2, day: "Wednesday",
    theme: "The \u00a3470 that never existed",
    voice: "Client", framework: "SLAY",
    content: "I was accused of owing \u00a3470 I didn\u2019t owe.\n\nThe proof was in a spreadsheet they sent me themselves.\n\nMy landlord \u2014 a massive corporate operation, two towers, 35 floors, thousands of tenants \u2014 sent someone called Matthew to do a fire door safety check.\n\nWhile he was there, I mentioned some ongoing issues. Heating outages. Missing keys. Things that had been raised and ignored.\n\nHe said he\u2019d help. Send him an email.\n\nAt 10:30 that night, instead of addressing any of the issues I\u2019d raised, he replied accusing me of being in rent arrears. Demanded payment within 24 hours.\n\nI knew I\u2019d paid everything. So I went through the ledger he\u2019d attached, line by line.\n\nA heating reimbursement they\u2019d already given us had been duplicated on the ledger, reversed, and left the account showing negative \u00a3470.\n\nThe exact amount Matthew was claiming I owed.\n\nI put the evidence back in an email.\n\nNo response. Ever.\n\nThis is what happens when documentation isn\u2019t thorough. When records aren\u2019t checked. When someone relies on a number without verifying the trail behind it.\n\nDocumentation protects truth. But only if someone is willing to go through it properly.\n\nPS \u2014 Have you ever found an error that changed the entire picture?"
  },
  {
    num: 11, week: 3, phase: 2, day: "Thursday",
    theme: "Professional-looking doesn't mean compliant",
    voice: "Professional", framework: "PAS",
    content: "The building had 35 floors and a concierge.\n\nThey still couldn\u2019t secure a deposit properly.\n\nOne of the most important things my tenancy experience taught me: the size and appearance of an operation tells you nothing about its compliance.\n\nThis was a corporate landlord. Multiple towers. Thousands of units across the UK. Gym. Cinema room. Professional management team.\n\nAnd yet:\n- Our security deposit wasn\u2019t secured within the legal timeframe\n- We were given one key instead of the two specified in the tenancy\n- The heating didn\u2019t work when we moved in\n- Fire doors in the building weren\u2019t functioning\n\nEvery single one of these is a compliance failure. Not a grey area. A clear breach.\n\nI see the same pattern in legal practice.\n\nFirms that look established, processes that seem solid, offices that feel professional. But when you look at the documentation \u2014 the actual records of what was discussed, agreed, and actioned \u2014 the gaps are there.\n\nProfessional-looking and compliant are not the same thing.\n\nLegalNote exists because what\u2019s on paper should match what happened. Every time. Regardless of how impressive the letterhead looks.\n\nPS \u2014 What\u2019s one compliance gap you\u2019ve noticed hiding behind a professional exterior?"
  },
  {
    num: 12, week: 3, phase: 2, day: "Saturday",
    theme: "Spotting talent before anyone else",
    voice: "Personal/Leadership", framework: "SLAY",
    content: "I met Ed Sheeran before anyone knew his name.\n\nI also recruited someone who became the UK\u2019s top seller in an entire distribution network.\n\nThere\u2019s a pattern in my life that I only recently understood.\n\nAt the O2, before Ed Sheeran was Ed Sheeran, I saw something. At a small venue, before Sigala had a single chart hit, I saw something. In a conversation with someone who\u2019d never sold anything before, I saw something.\n\nThe skill isn\u2019t prediction. It\u2019s recognition.\n\nSeeing potential in people before they see it in themselves. Then creating the conditions for them to prove it.\n\nWith my distribution business, I didn\u2019t compete with the person I recruited. I built the platform. Provided training. Genuine support. Not performative mentorship. Actual empathy and consistent follow-through.\n\nShe went on to become the top seller in the entire UK operation.\n\nI\u2019ve always been drawn to elevating others. Building them up. Celebrating their progress.\n\nLegalNote is the first time I\u2019ve fully backed myself.\n\nAfter years of recognising potential in others, I finally looked in the mirror and applied the same lens.\n\nPS \u2014 Who did you believe in before anyone else did?"
  },
  {
    num: 13, week: 4, phase: 2, day: "Monday",

  var html = '<button class="active" data-week="all">All Weeks</button>';
  weeks.forEach(function(w) {
    html += '<button data-week="' + w + '">Week ' + w + '</button>';
  });
  nav.innerHTML = html;
}

function renderPosts() {
  var container = document.getElementById('postsContainer');
  var filtered = posts.filter(function(p) {
    if (currentPhase !== 'all' && p.phase !== parseInt(currentPhase)) return false;
    if (currentWeek !== 'all' && p.week !== parseInt(currentWeek)) return false;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:40px;">No posts found.</p>';
    return;
  }

  var lastWeek = null;
  var lastPhase = null;
  var html = '';

  filtered.forEach(function(post) {
    if (currentPhase === 'all' && post.phase !== lastPhase) {
      html += '<div class="phase-hdr"><h2>' + phaseNames[post.phase] + '</h2><p>' + phaseDescs[post.phase] + '</p></div>';
      lastPhase = post.phase;
    }
    if (post.week !== lastWeek) {
      html += '<div class="week-hdr">WEEK ' + post.week + '</div>';
      lastWeek = post.week;
    }

    var pd = perfData[post.num];
    var hasData = pd && pd.postedAt;
    var perfBadge = hasData ? '<span class="perf-badge has-data">Tracked</span>' : '<span class="perf-badge">Not posted</span>';

    html += '<div class="card" id="post-' + post.num + '">';
    html += '<div class="meta">';
    html += '<span class="tag tag-num">#' + post.num + '</span>';
    html += '<span class="tag tag-day">' + post.day + '</span>';
    html += '<span class="tag tag-voice">' + post.voice + '</span>';
    html += '<span class="tag tag-fw">' + post.framework + '</span>';
    html += perfBadge;
    html += '</div>';
    html += '<div class="theme">' + escapeHtml(post.theme) + '</div>';
    html += '<div class="content" id="content-' + post.num + '">' + escapeHtml(post.content) + '</div>';
    html += '<div class="actions">';
    html += '<button class="btn btn-expand" data-action="expand" data-num="' + post.num + '">Read full post</button>';
    html += '<button class="btn" data-action="copy" data-num="' + post.num + '">Copy</button>';
    html += '<button class="btn btn-chat" data-action="chat" data-num="' + post.num + '">Edit / Discuss</button>';
    html += '<button class="btn btn-track" data-action="track" data-num="' + post.num + '">Track Performance</button>';
    html += '</div>';

    html += buildChatPanel(post);
    html += buildPerfPanel(post, pd);

    html += '</div>';
  });

  container.innerHTML = html;
}

function buildChatPanel(post) {
  var h = '';
  h += '<div class="chat-panel" id="chat-' + post.num + '">';
  h += '<h4>Edit / Discuss - Post #' + post.num + '</h4>';
  h += '<div class="chat-messages" id="chat-messages-' + post.num + '">';
  var history = chatHistories[post.num];
  if (history && history.length > 0) {
    history.forEach(function(msg) {
      h += renderChatMessage(msg, post.num);
    });
  } else {
    h += '<p style="font-size:12px;color:#64748b;padding:8px 0;">Ask for edits, discuss tone, request rewrites, or get feedback on this post. Your conversation history is kept during this session.</p>';
  }
  h += '</div>';
  h += '<div class="chat-input-row">';
  h += '<textarea class="chat-input" id="chat-input-' + post.num + '" data-num="' + post.num + '" placeholder="e.g. Make the hook shorter, add more urgency to the ending..." rows="1"></textarea>';
  h += '<button class="chat-send" data-action="send-chat" data-num="' + post.num + '">Send</button>';
  h += '</div>';
  h += '</div>';
  return h;
}

function renderChatMessage(msg, postNum) {
  var h = '';
  if (msg.role === 'user') {
    h += '<div class="chat-msg chat-msg-user"><div class="chat-msg-label">You</div>' + escapeHtml(msg.display || msg.content) + '</div>';
  } else if (msg.role === 'assistant') {
    h += '<div class="chat-msg chat-msg-ai"><div class="chat-msg-label">AI</div>';
    if (msg.parsed && msg.parsed.type === 'edit') {
      h += '<div>' + escapeHtml(msg.parsed.explanation || '') + '</div>';
      h += '<div class="edit-preview">' + escapeHtml(msg.parsed.content) + '</div>';
      h += '<div class="edit-actions">';
      h += '<button class="btn-apply" data-action="apply-edit" data-num="' + postNum + '" data-idx="' + (msg.idx || 0) + '">Apply Edit</button>';
      h += '<button class="btn-discard" data-action="discard-edit" data-num="' + postNum + '">Keep Original</button>';
      h += '</div>';
    } else if (msg.parsed && msg.parsed.type === 'discussion') {
      h += escapeHtml(msg.parsed.response);
    } else {
      h += escapeHtml(msg.content);
    }
    h += '</div>';
  }
  return h;
}

function buildPerfPanel(post, pd) {
  var h = '';
  h += '<div class="perf" id="perf-' + post.num + '">';
  h += '<h4>Performance Tracking - Post #' + post.num + '</h4>';
  h += '<div class="perf-row"><label>Date & Time Posted</label>';
  h += '<input type="datetime-local" data-field="postedAt" data-num="' + post.num + '" value="' + (pd && pd.postedAt ? new Date(pd.postedAt).toISOString().slice(0,16) : '') + '"></div>';

  h += '<p style="font-size:11px;color:#64748b;font-weight:600;margin:12px 0 6px;">60-MINUTE SNAPSHOT</p>';
  h += '<div class="perf-grid">';
  h += '<div class="perf-field"><label>Impressions</label><input type="number" data-field="impressions60m" data-num="' + post.num + '" value="' + (pd ? pd.impressions60m || '' : '') + '" placeholder="0"></div>';
  h += '<div class="perf-field"><label>Interactions</label><input type="number" data-field="interactions60m" data-num="' + post.num + '" value="' + (pd ? pd.interactions60m || '' : '') + '" placeholder="0"></div>';
  h += '<div class="perf-field"><label>Comments</label><input type="number" data-field="comments60m" data-num="' + post.num + '" value="' + (pd ? pd.comments60m || '' : '') + '" placeholder="0"></div>';
  h += '</div>';

  h += '<p style="font-size:11px;color:#64748b;font-weight:600;margin:12px 0 6px;">24-HOUR SNAPSHOT</p>';
  h += '<div class="perf-grid">';
  h += '<div class="perf-field"><label>Impressions</label><input type="number" data-field="impressions24h" data-num="' + post.num + '" value="' + (pd ? pd.impressions24h || '' : '') + '" placeholder="0"></div>';
  h += '<div class="perf-field"><label>Interactions</label><input type="number" data-field="interactions24h" data-num="' + post.num + '" value="' + (pd ? pd.interactions24h || '' : '') + '" placeholder="0"></div>';
  h += '<div class="perf-field"><label>Comments</label><input type="number" data-field="comments24h" data-num="' + post.num + '" value="' + (pd ? pd.comments24h || '' : '') + '" placeholder="0"></div>';
  h += '</div>';

  h += '<p style="font-size:11px;color:#64748b;font-weight:600;margin:12px 0 6px;">3-DAY SNAPSHOT</p>';
  h += '<div class="perf-grid">';
  h += '<div class="perf-field"><label>Impressions</label><input type="number" data-field="impressions3d" data-num="' + post.num + '" value="' + (pd ? pd.impressions3d || '' : '') + '" placeholder="0"></div>';
  h += '<div class="perf-field"><label>Interactions</label><input type="number" data-field="interactions3d" data-num="' + post.num + '" value="' + (pd ? pd.interactions3d || '' : '') + '" placeholder="0"></div>';
  h += '<div class="perf-field"><label>Comments</label><input type="number" data-field="comments3d" data-num="' + post.num + '" value="' + (pd ? pd.comments3d || '' : '') + '" placeholder="0"></div>';
  h += '</div>';

  h += '<p style="font-size:11px;color:#64748b;font-weight:600;margin:12px 0 6px;">7-DAY SNAPSHOT</p>';
  h += '<div class="perf-grid">';
  h += '<div class="perf-field"><label>Impressions</label><input type="number" data-field="impressions7d" data-num="' + post.num + '" value="' + (pd ? pd.impressions7d || '' : '') + '" placeholder="0"></div>';
  h += '<div class="perf-field"><label>Interactions</label><input type="number" data-field="interactions7d" data-num="' + post.num + '" value="' + (pd ? pd.interactions7d || '' : '') + '" placeholder="0"></div>';
  h += '<div class="perf-field"><label>Comments</label><input type="number" data-field="comments7d" data-num="' + post.num + '" value="' + (pd ? pd.comments7d || '' : '') + '" placeholder="0"></div>';
  h += '</div>';

  h += '<div class="perf-row"><label>Notes</label>';
  h += '<input type="text" data-field="notes" data-num="' + post.num + '" value="' + escapeHtml(pd && pd.notes ? pd.notes : '') + '" placeholder="What worked? What didn\'t?"></div>';

  h += '<button class="perf-save" data-action="save" data-num="' + post.num + '">Save Performance Data</button>';
  h += '</div>';
  return h;
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function() { return true; }).catch(function() { return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '-9999px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  return ok;
}

function savePerformance(num) {
  var panel = document.getElementById('perf-' + num);
  var inputs = panel.querySelectorAll('input');
  var data = { postNumber: num };

  inputs.forEach(function(inp) {
    var field = inp.getAttribute('data-field');
    if (field === 'postedAt') {
      data[field] = inp.value ? new Date(inp.value).toISOString() : null;
    } else if (field === 'notes') {
      data[field] = inp.value || null;
    } else {
      data[field] = inp.value ? parseInt(inp.value) : null;
    }
  });

  var saveBtn = panel.querySelector('.perf-save');
  saveBtn.textContent = 'Saving...';

  fetch('/api/linkedin-performance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    perfData[num] = d;
    saveBtn.textContent = 'Saved!';
    saveBtn.classList.add('perf-saved');
    showToast('Performance data saved for Post #' + num);
    setTimeout(function() {
      saveBtn.textContent = 'Save Performance Data';
      saveBtn.classList.remove('perf-saved');
    }, 2000);
  })
  .catch(function() {
    saveBtn.textContent = 'Error - Try Again';
    setTimeout(function() { saveBtn.textContent = 'Save Performance Data'; }, 2000);
  });
}

function sendChatMessage(num) {
  var input = document.getElementById('chat-input-' + num);
  var message = input.value.trim();
  if (!message) return;

  var post = posts.find(function(p) { return p.num === num; });
  if (!post) return;

  if (!chatHistories[num]) chatHistories[num] = [];

  chatHistories[num].push({ role: 'user', content: message, display: message });

  var messagesDiv = document.getElementById('chat-messages-' + num);
  messagesDiv.innerHTML = '';
  chatHistories[num].forEach(function(msg) {
    messagesDiv.innerHTML += renderChatMessage(msg, num);
  });
  messagesDiv.innerHTML += '<div class="chat-typing" id="typing-' + num + '">Thinking...</div>';
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  input.value = '';
  var sendBtn = document.querySelector('[data-action="send-chat"][data-num="' + num + '"]');
  sendBtn.disabled = true;

  var apiHistory = chatHistories[num].filter(function(m) { return m.role === 'user' || m.role === 'assistant'; }).map(function(m) {
    return { role: m.role, content: m.content };
  });
  apiHistory.pop();

  fetch('/api/linkedin-post-chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      postNumber: num,
      currentContent: post.content,
      theme: post.theme,
      message: message,
      history: apiHistory
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    var typing = document.getElementById('typing-' + num);
    if (typing) typing.remove();

    var idx = chatHistories[num].length;
    chatHistories[num].push({
      role: 'assistant',
      content: JSON.stringify(result),
      parsed: result,
      idx: idx
    });

    messagesDiv.innerHTML = '';
    chatHistories[num].forEach(function(msg) {
      messagesDiv.innerHTML += renderChatMessage(msg, num);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    sendBtn.disabled = false;
  })
  .catch(function(err) {
    var typing = document.getElementById('typing-' + num);
    if (typing) typing.remove();
    messagesDiv.innerHTML += '<div class="chat-msg chat-msg-ai"><div class="chat-msg-label">AI</div>Something went wrong. Please try again.</div>';
    sendBtn.disabled = false;
  });
}

function applyEdit(num, idx) {
  var history = chatHistories[num];
  if (!history) return;

  var msg = history.find(function(m) { return m.idx === idx && m.parsed && m.parsed.type === 'edit'; });
  if (!msg) {
    for (var i = history.length - 1; i >= 0; i--) {
      if (history[i].parsed && history[i].parsed.type === 'edit') {
        msg = history[i];
        break;
      }
    }
  }
  if (!msg || !msg.parsed || !msg.parsed.content) return;

  var post = posts.find(function(p) { return p.num === num; });
  if (!post) return;

  post.content = msg.parsed.content;

  var contentEl = document.getElementById('content-' + num);
  if (contentEl) {
    contentEl.textContent = post.content;
  }

  showToast('Post #' + num + ' updated with edit');
}

document.getElementById('phaseNav').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  currentPhase = btn.getAttribute('data-phase');
  currentWeek = 'all';
  this.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  updateWeekNav();
  renderPosts();
});

document.getElementById('weekNav').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  currentWeek = btn.getAttribute('data-week');
  this.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderPosts();
});

document.getElementById('postsContainer').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;

  var action = btn.getAttribute('data-action');
  var num = parseInt(btn.getAttribute('data-num'));

  if (action === 'expand') {
    var content = document.getElementById('content-' + num);
    if (content.classList.contains('open')) {
      content.classList.remove('open');
      btn.textContent = 'Read full post';
    } else {
      content.classList.add('open');
      btn.textContent = 'Show less';
    }
  }

  if (action === 'copy') {
    var post = posts.find(function(p) { return p.num === num; });
    copyToClipboard(post.content).then(function() {
      btn.textContent = 'Copied!';
      showToast('Post #' + num + ' copied to clipboard');
      setTimeout(function() { btn.textContent = 'Copy'; }, 2000);
    });
  }

  if (action === 'chat') {
    var panel = document.getElementById('chat-' + num);
    if (panel.classList.contains('open')) {
      panel.classList.remove('open');
    } else {
      panel.classList.add('open');
      var input = document.getElementById('chat-input-' + num);
      if (input) input.focus();
    }
  }

  if (action === 'track') {
    var perfPanel = document.getElementById('perf-' + num);
    if (perfPanel.classList.contains('open')) {
      perfPanel.classList.remove('open');
    } else {
      perfPanel.classList.add('open');
    }
  }

  if (action === 'save') {
    savePerformance(num);
  }

  if (action === 'send-chat') {
    sendChatMessage(num);
  }

  if (action === 'apply-edit') {
    applyEdit(num, parseInt(btn.getAttribute('data-idx')));
  }

  if (action === 'discard-edit') {
    showToast('Keeping original post content');
  }
});

document.getElementById('postsContainer').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    var target = e.target;
    if (target.classList && target.classList.contains('chat-input')) {
      e.preventDefault();
      var num = parseInt(target.getAttribute('data-num'));
      sendChatMessage(num);
    }
  }
});

loadPerfData();
renderPosts();
</script>

</body>
