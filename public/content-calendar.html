let currentPhase = 'all';
let currentWeek = 'all';

function showPhase(phase, btn) {
  currentPhase = phase;
  currentWeek = 'all';
  document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateWeekTabs();
  renderPosts();
}

function showWeek(week, btn) {
  currentWeek = week;
  document.querySelectorAll('.week-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPosts();
}

function updateWeekTabs() {
  const container = document.getElementById('weekTabs');
  let weeks = [1,2,3,4,5,6,7,8];
  if (currentPhase !== 'all') {
    const phaseWeeks = {1:[1,2], 2:[3,4], 3:[5,6], 4:[7,8]};
    weeks = phaseWeeks[currentPhase];
  }
  let html = `<button class="week-tab active" onclick="showWeek('all', this)">All Weeks</button>`;
  weeks.forEach(w => {
    html += `<button class="week-tab" onclick="showWeek(${w}, this)">Week ${w}</button>`;
  });
  container.innerHTML = html;
}

function renderPosts() {
  const container = document.getElementById('postsContainer');
  let filtered = posts;
  if (currentPhase !== 'all') {
    filtered = filtered.filter(p => p.phase === currentPhase);
  }
  if (currentWeek !== 'all') {
    filtered = filtered.filter(p => p.week === currentWeek);
  }

  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:40px;">No posts found for this selection.</p>';
    return;
  }

  let lastWeek = null;
  let lastPhase = null;
  let html = '';

  const phaseNames = {
    1: 'Phase 1: Origin & Credibility',
    2: 'Phase 2: Problem & Pain',
    3: 'Phase 3: Vision & Proof',
    4: 'Phase 4: Authority & Community'
  };
  const phaseDescs = {
    1: 'Establish who you are. The background nobody expects.',
    2: 'Make solicitors feel seen. Build urgency around compliance gaps.',
    3: 'Show traction. Build in public with substance.',
    4: 'Lead the conversation. Cast the vision.'
  };

  filtered.forEach(post => {
    if (currentPhase === 'all' && post.phase !== lastPhase) {
      html += `<div class="phase-header"><h2>${phaseNames[post.phase]}</h2><p>${phaseDescs[post.phase]}</p></div>`;
      lastPhase = post.phase;
    }
    if (post.week !== lastWeek) {
      html += `<div style="padding:12px 0 4px;"><span style="font-size:13px;font-weight:600;color:#64748b;">WEEK ${post.week}</span></div>`;
      lastWeek = post.week;
    }

    html += `
      <div class="post-card" id="post-${post.num}">
        <div class="post-meta">
          <span class="post-number">#${post.num}</span>
          <span class="post-day">${post.day}</span>
          <span class="post-voice">${post.voice}</span>
          <span class="post-framework">${post.framework}</span>
        </div>
        <div class="post-theme">${post.theme}</div>
        <div class="post-content" id="content-${post.num}">${escapeHtml(post.content)}</div>
        <div class="post-actions">
          <button class="expand-btn" onclick="toggleExpand(${post.num})" id="expand-${post.num}">Read full post</button>
          <button class="action-btn" onclick="copyPost(${post.num})" id="copy-${post.num}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            Copy
          </button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function toggleExpand(num) {
  const content = document.getElementById(`content-${num}`);
  const btn = document.getElementById(`expand-${num}`);
  content.classList.toggle('expanded');
  btn.textContent = content.classList.contains('expanded') ? 'Show less' : 'Read full post';
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    return true;
  } catch (e) {
    return false;
  } finally {
    document.body.removeChild(ta);
  }
}

function copyPost(num) {
  const post = posts.find(p => p.num === num);
  const onSuccess = () => {
    const btn = document.getElementById(`copy-${num}`);
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Copied`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`;
    }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(post.content).then(onSuccess).catch(() => {
      if (fallbackCopy(post.content)) onSuccess();
    });
  } else {
    if (fallbackCopy(post.content)) onSuccess();
  }
}

renderPosts();
</script>
